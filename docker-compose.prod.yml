# PartyParadise production stack. Put a TLS proxy in front of web and api.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# The migrate service runs once before the API starts.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: partyparadise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./api
      target: production
    environment: &api-env
      ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/partyparadise
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:?Set INTERNAL_WEBHOOK_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:?Set PAYSTACK_SECRET_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:?Set SENDGRID_API_KEY}
      WEB_URL: ${WEB_URL:?Set WEB_URL}
      PORTAL_URL: ${WEB_URL}/portal
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  api:
    build:
      context: ./api
      target: production
    restart: unless-stopped
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
      INTERNAL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
